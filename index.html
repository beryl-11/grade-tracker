<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width initial-scale=1.0">
  <title>Grade Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="global-header flex-container">
    <div class="logo-wrapper">
      <a href="index.html" class="logo">{Grade Tracker}</a>
    </div>

    <div class="header-btn-wrapper flex-container">
      <button type="button" class="global-header-btn" id="settings-btn" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
          <path fill-rule="evenodd"
            d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.02.12-.115.26-.297.348a7.493 7.493 0 0 0-.986.57c-.166.115-.334.126-.45.083L6.3 5.508a1.875 1.875 0 0 0-2.282.819l-.922 1.597a1.875 1.875 0 0 0 .432 2.385l.84.692c.095.078.17.229.154.43a7.598 7.598 0 0 0 0 1.139c.015.2-.059.352-.153.43l-.841.692a1.875 1.875 0 0 0-.432 2.385l.922 1.597a1.875 1.875 0 0 0 2.282.818l1.019-.382c.115-.043.283-.031.45.082.312.214.641.405.985.57.182.088.277.228.297.35l.178 1.071c.151.904.933 1.567 1.85 1.567h1.844c.916 0 1.699-.663 1.85-1.567l.178-1.072c.02-.12.114-.26.297-.349.344-.165.673-.356.985-.57.167-.114.335-.125.45-.082l1.02.382a1.875 1.875 0 0 0 2.28-.819l.923-1.597a1.875 1.875 0 0 0-.432-2.385l-.84-.692c-.095-.078-.17-.229-.154-.43a7.614 7.614 0 0 0 0-1.139c-.016-.2.059-.352.153-.43l.84-.692c.708-.582.891-1.59.433-2.385l-.922-1.597a1.875 1.875 0 0 0-2.282-.818l-1.02.382c-.114.043-.282.031-.449-.083a7.49 7.49 0 0 0-.985-.57c-.183-.087-.277-.227-.297-.348l-.179-1.072a1.875 1.875 0 0 0-1.85-1.567h-1.843ZM12 15.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z"
            clip-rule="evenodd" />
        </svg>
      </button>

      <button type="button" class="global-header-btn" id="sign-in-btn" aria-label="Sign In">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="icon">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>

      </button>
    </div>
  </header>

  <main>
    <header id="intro">
      <h1 class="page-title">Hello, {name}.</h1>
      <p class="overall-grade" id="overall-gpa-statement">Your estimated current GPA is {3.00}.</p>
    </header>

    <hr>
    </hr>

    <section id="grade-details">
      <h1>Details</h1>
      <div class="grid-container" id="grade-details-grid">
        <div class="flex-container" id="details-list">
          <div class="semester-group" id="Fall-2026-group">
            <button type="button" class="collapsible-btn">Fall 2026</button>

            <table class="collapsible-content">
              <tr data-href="./F26C1.html" class="row-link" href="F26C1.html">
                <td class="course-name">F26C1</td>
                <td class="course-grade">A+</td>
              </tr>
              <tr data-href="./F26C1.html" class="row-link" href="F26C1.html">
                <td class="course-name">F26C2</td>
                <td class="course-grade">A-</td>
              </tr>
              <tr data-href="./F26C1.html" class="row-link" href="F26C1.html">
                <td class="grid-container course-name">F26C3</td>
                <td class="course-grade">A</td>
              </tr>
              <tr data-href="./F26C1.html" class="row-link" href="F26C1.html">
                <td class="course-name">F26C4</td>
                <td class="course-grade">A</td>
              </tr>
            </table>
          </div>

          <div class="semester-group" id="Spring-2026-group">
            <button type="button" class="collapsible-btn">Spring 2026</button>

            <table class="collapsible-content">
              <tr data-href="./F26C1.html" class="row-link" href="S26C1.html">
                <td class="course-name">S26C1</td>
                <td class="course-grade">A+</td>
              </tr>
            </table>
          </div>

          <script>
            /* Link Table Rows */
            document.addEventListener("DOMContentLoaded", () => {
              const rows = document.querySelectorAll("tr[data-href]");
              rows.forEach(row => {
                row.addEventListener("click", () => {
                  window.location.href = row.dataset.href;
                })
              })
            })
          </script>
        </div>

        <div class="graph-wrapper">
          <div class="circle-placeholder" id="gpa-breakdown-graph"></div>
        </div>
      </div>
    </section>

    <aside class="toolbar">
      <button type="button" class="toolbar-btn" id="add-course-btn" aria-label="Add Course">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </aside>
  </main>
</body>

</html>
